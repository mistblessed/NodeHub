{% extends "base.html" %}
{% block content %}
<div class="text-center mt-5">
    <h1>Добро пожаловать в NodeHub</h1>
    <p class="lead">Образовательная платформа для изучения Node.js</p>
    {% if not current_user.is_authenticated %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg">Начать обучение</a>
    {% endif %}
</div>
{% endblock %}
