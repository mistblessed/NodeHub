{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h1 class="fw-bold mb-4">Контакты</h1>
        
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2 text-success"></i>Наш адрес</h5>
            <p>г. Екатеринбург, ул. Декабристов, д. 83<br>Екатеринбургский монтажный колледж</p>
            
            <h5 class="fw-bold mb-3 mt-4"><i class="bi bi-envelope me-2 text-success"></i>Email</h5>
            <p><a href="mailto:info@nodehub.ru" class="text-decoration-none">info@nodehub.ru</a></p>
            
            <h5 class="fw-bold mb-3 mt-4"><i class="bi bi-telegram me-2 text-success"></i>Telegram</h5>
            <p><a href="https://t.me/emk" class="text-decoration-none">@emk</a></p>
        </div>
        
        <p class="text-muted mb-4">Остались вопросы? Заполните форму ниже.</p>
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input type="text" name="name" class="form-control" 
                           value="{{ current_user.username if current_user.is_authenticated else '' }}" 
                           placeholder="Ваше имя">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" 
                           value="{{ current_user.email if current_user.is_authenticated else '' }}" 
                           placeholder="your@email.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Тема</label>
                    <input type="text" name="subject" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Сообщение</label>
                    <textarea name="message" class="form-control" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-success rounded-pill px-4">Отправить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
