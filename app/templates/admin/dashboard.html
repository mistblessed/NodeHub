{% extends "admin/layout.html" %}
{% block admin_content %}
<h3 class="fw-bold mb-4"><i class="bi bi-speedometer2 me-2 text-success"></i>Панель управления</h3>

<div class="row g-4">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body text-center p-4">
                <i class="bi bi-people fs-1 text-primary mb-3"></i>
                <h5>Пользователи</h5>
                <p class="text-muted">Управление учётными записями и ролями</p>
                <a href="{{ url_for('admin.list_users') }}" class="btn btn-outline-primary rounded-pill">Перейти</a>
            </div>
        </div>
    </div>
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body text-center p-4">
                <i class="bi bi-collection-play fs-1 text-success mb-3"></i>
                <h5>Модули</h5>
                <p class="text-muted">Управление структурой учебного курса</p>
                <a href="{{ url_for('admin.list_modules') }}" class="btn btn-outline-success rounded-pill">Перейти</a>
            </div>
        </div>
    </div>
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body text-center p-4">
                <i class="bi bi-patch-question fs-1 text-warning mb-3"></i>
                <h5>Тесты</h5>
                <p class="text-muted">Создание и редактирование тестов</p>
                <a href="{{ url_for('admin.list_modules') }}" class="btn btn-outline-warning rounded-pill">Перейти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
