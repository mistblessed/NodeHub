{% extends "admin/layout.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold m-0"><i class="bi bi-pencil-square me-2 text-warning"></i>Редактирование теста</h3>
    <a href="{{ url_for('admin.list_tests', module_id=module.id) }}" class="btn btn-outline-secondary rounded-pill">
        <i class="bi bi-arrow-left me-1"></i> К списку тестов
    </a>
</div>

<div class="card border-0 shadow-sm rounded-4 mb-4">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="testTitle" class="form-label fw-semibold">Название теста</label>
            <div class="input-group">
                <input type="text" name="title" id="testTitle" class="form-control" value="{{ test.title }}" required>
                <button type="submit" class="btn btn-warning rounded-pill px-4">
                    <i class="bi bi-check-lg me-1"></i> Сохранить
                </button>
            </div>
        </form>
    </div>
</div>

<h4 class="fw-bold mb-3">
    <i class="bi bi-question-circle me-2 text-success"></i>Вопросы
    <a href="{{ url_for('admin.add_question', test_id=test.id) }}" class="btn btn-success btn-sm rounded-pill ms-2">
        <i class="bi bi-plus-lg"></i> Добавить вопрос
    </a>
</h4>

{% if questions %}
<div class="row g-3">
    {% for q in questions %}
    <div class="col-12">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body d-flex justify-content-between align-items-start">
                <div>
                    <span class="badge bg-secondary rounded-pill me-2">{{ q.question_type }}</span>
                    <span class="fw-semibold">{{ q.text }}</span>
                </div>
                <div class="d-flex gap-1 flex-shrink-0">
                    <a href="{{ url_for('admin.edit_question', test_id=test.id, question_id=q.id) }}" class="btn btn-sm btn-outline-primary rounded-pill">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form method="POST" action="{{ url_for('admin.delete_question_view', test_id=test.id, question_id=q.id) }}" class="d-inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill" onclick="return confirm('Удалить вопрос?')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center py-3 bg-light rounded-4">
    <p class="text-muted mb-0">Вопросов пока нет.</p>
</div>
{% endif %}
{% endblock %}
