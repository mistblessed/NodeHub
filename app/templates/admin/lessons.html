{% extends "base.html" %}
{% block content %}
<h1>Уроки модуля «{{ module.title }}»</h1>
<a href="{{ url_for('admin.create_lesson_view', module_id=module.id) }}" class="btn btn-success mb-3">Добавить урок</a>
<table class="table table-bordered">
    <thead><tr><th>ID</th><th>Название</th><th>Порядок</th><th>Действия</th></tr></thead>
    <tbody>
        {% for lesson in lessons %}
        <tr>
            <td>{{ lesson.id }}</td>
            <td>{{ lesson.title }}</td>
            <td>{{ lesson.order }}</td>
            <td>
                <a href="{{ url_for('admin.edit_lesson', lesson_id=lesson.id) }}" class="btn btn-sm btn-primary">Ред.</a>
                <form method="POST" action="{{ url_for('admin.delete_lesson_view', lesson_id=lesson.id) }}" class="d-inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Удалить урок?')">Удалить</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{{ url_for('admin.list_modules') }}" class="btn btn-secondary">Назад к модулям</a>
{% endblock %}
