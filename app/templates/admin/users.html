{% extends "base.html" %}
{% block content %}
<h1>Управление пользователями</h1>
<table class="table table-bordered mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>Логин</th>
            <th>Email</th>
            <th>Роль</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>
                <form method="POST" action="{{ url_for('admin.change_role', user_id=user.id) }}" class="d-flex mb-1">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <select name="role" class="form-select form-select-sm me-2">
                        ...
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary">Изменить</button>
                </form>

                <form method="POST" action="{{ url_for('admin.delete_user_view', user_id=user.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-sm btn-danger"
                        onclick="return confirm('Удалить пользователя?')">Удалить</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Назад</a>
{% endblock %}
