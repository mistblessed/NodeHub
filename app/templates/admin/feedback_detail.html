{% extends "admin/layout.html" %}
{% block admin_content %}
<h3 class="fw-bold mb-4"><i class="bi bi-envelope-open me-2 text-success"></i>Обращение #{{ feedback.id }}</h3>
<div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
    <div class="d-flex justify-content-between mb-3">
        <div>
            <strong>От:</strong> {{ feedback.name }} ({{ feedback.email }})<br>
            <strong>Дата:</strong> {{ feedback.created_at.strftime('%d.%m.%Y %H:%M') }}
        </div>
        <div>
            <span class="badge {% if feedback.status=='new' %}bg-danger{% elif feedback.status=='read' %}bg-secondary{% else %}bg-success{% endif %} rounded-pill fs-6">{{ feedback.status }}</span>
        </div>
    </div>
    <h5>{{ feedback.subject }}</h5>
    <p class="mt-3">{{ feedback.message }}</p>
</div>
<div class="d-flex gap-2">
    <form method="POST" action="{{ url_for('admin.feedback_change_status', feedback_id=feedback.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <select name="status" class="form-select form-select-sm d-inline w-auto">
            <option value="new" {% if feedback.status=='new' %}selected{% endif %}>Новое</option>
            <option value="read" {% if feedback.status=='read' %}selected{% endif %}>Прочитано</option>
            <option value="replied" {% if feedback.status=='replied' %}selected{% endif %}>Отвечено</option>
        </select>
        <button type="submit" class="btn btn-sm btn-primary rounded-pill ms-2">Обновить статус</button>
    </form>
    <form method="POST" action="{{ url_for('admin.feedback_delete', feedback_id=feedback.id) }}" onsubmit="return confirm('Удалить обращение?')">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill">Удалить</button>
    </form>
</div>
<a href="{{ url_for('admin.feedback_list') }}" class="btn btn-secondary rounded-pill mt-3">Назад к списку</a>
{% endblock %}
