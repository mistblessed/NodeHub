{% extends "admin/layout.html" %}
{% block admin_content %}
<h3 class="fw-bold mb-4">
    {% if question %}Редактирование вопроса{% else %}Новый вопрос{% endif %}
    <small class="text-muted fs-6"> для теста «{{ test.title }}»</small>
</h3>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="text" class="form-label fw-semibold">Текст вопроса</label>
        <textarea name="text" id="text" class="form-control" rows="2" required>{{ form_data['text'] if form_data else (question.text if question else '') }}</textarea>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label for="qtype" class="form-label fw-semibold">Тип вопроса</label>
            <select name="question_type" id="qtype" class="form-select" required>
                <option value="single_choice" {% if (form_data and form_data.get('question_type') == 'single_choice') or (question and question.question_type == 'single_choice') %}selected{% endif %}>Одиночный выбор (radio)</option>
                <option value="multiple_choice" {% if (form_data and form_data.get('question_type') == 'multiple_choice') or (question and question.question_type == 'multiple_choice') %}selected{% endif %}>Множественный выбор (checkbox)</option>
                <option value="text_input" {% if (form_data and form_data.get('question_type') == 'text_input') or (question and question.question_type == 'text_input') %}selected{% endif %}>Текстовый ввод</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="correct_answer" class="form-label fw-semibold">Правильный ответ</label>
            <input type="text" name="correct_answer" id="correct_answer" class="form-control" value="{{ form_data['correct_answer'] if form_data else (question.correct_answer if question else '') }}" required>
            <small class="text-muted">Для multiple_choice введите JSON-массив выбранных вариантов.</small>
        </div>
    </div>

    <div class="mb-3" id="options-group">
        <label for="options" class="form-label fw-semibold">Варианты ответов <small class="text-muted">(JSON-массив)</small></label>
        <textarea name="options" id="options" class="form-control" rows="3">{{ form_data['options'] if form_data else (question.options | tojson if question and question.options else '') }}</textarea>
        <small class="text-muted">Например: ["Вариант 1", "Вариант 2"]</small>
    </div>

    <button type="submit" class="btn btn-success rounded-pill px-4">
        <i class="bi bi-check-lg me-1"></i> Сохранить
    </button>
    <a href="{{ url_for('admin.edit_test', test_id=test.id) }}" class="btn btn-outline-secondary rounded-pill px-4">
        Отмена
    </a>
</form>

<script>
(function() {
    var select = document.getElementById('qtype');
    var optGroup = document.getElementById('options-group');
    function toggleOptions() {
        if (select.value === 'text_input') {
            optGroup.style.display = 'none';
        } else {
            optGroup.style.display = 'block';
        }
    }
    select.addEventListener('change', toggleOptions);
    toggleOptions();
})();
</script>
{% endblock %}
