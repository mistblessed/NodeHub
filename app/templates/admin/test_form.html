{% extends "base.html" %}
{% block content %}
<h1>{% if test %}Редактирование теста{% else %}Новый тест{% endif %} (модуль «{{ module.title }}»)</h1>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Название теста</label><input type="text" name="title" class="form-control" value="{{ test.title if test else '' }}" required></div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('admin.list_tests', module_id=module.id) }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
