{% extends "admin/layout.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold m-0"><i class="bi bi-collection-play me-2 text-success"></i>Модули</h3>
    <a href="{{ url_for('admin.create_module_view') }}" class="btn btn-success rounded-pill">
        <i class="bi bi-plus-lg me-1"></i> Добавить модуль
    </a>
</div>

<div class="row g-4">
    {% for module in modules %}
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body">
                <h5 class="fw-bold">{{ module.title }}</h5>
                <p class="text-muted small">{{ module.description or 'Без описания' }}</p>
                <div class="d-flex gap-2 mt-3 flex-wrap">
                    <a href="{{ url_for('admin.list_lessons', module_id=module.id) }}" class="btn btn-sm btn-outline-primary rounded-pill">
                        <i class="bi bi-journal-text me-1"></i> Уроки
                    </a>
                    <a href="{{ url_for('admin.list_tests', module_id=module.id) }}" class="btn btn-sm btn-outline-warning rounded-pill">
                        <i class="bi bi-patch-question me-1"></i> Тесты
                    </a>
                    <a href="{{ url_for('admin.edit_module', module_id=module.id) }}" class="btn btn-sm btn-outline-secondary rounded-pill">
                        <i class="bi bi-pencil me-1"></i> Ред.
                    </a>
                    <button type="button" class="btn btn-sm btn-outline-danger rounded-pill"
                            data-bs-toggle="modal" data-bs-target="#deleteModuleModal{{ module.id }}">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Модальное окно удаления модуля -->
        <div class="modal fade" id="deleteModuleModal{{ module.id }}" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content rounded-4 border-0 shadow">
                    <div class="modal-body p-4 text-center">
                        <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
                        <p class="mt-2 mb-0">Удалить модуль <strong>{{ module.title }}</strong>?</p>
                        <form method="POST" action="{{ url_for('admin.delete_module_view', module_id=module.id) }}" class="mt-3">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="btn btn-danger rounded-pill px-4">Удалить</button>
                            <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Отмена</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
