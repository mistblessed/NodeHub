{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center text-center mt-5">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg rounded-4 p-5">
            <i class="bi bi-emoji-frown text-muted display-1 mb-3"></i>
            <h1 class="display-4 fw-bold text-dark mb-3">404</h1>
            <h2 class="fw-bold mb-3">Страница не найдена</h2>
            <p class="lead text-muted mb-4">Возможно, она была удалена или вы указали неверный адрес.</p>
            <a href="{{ url_for('index') }}" class="btn btn-success btn-lg rounded-pill px-4">
                <i class="bi bi-house-door me-2"></i> Вернуться на главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
